# Cube CS Lite settings
# Written by the game. Missing keys keep their default value.
# Keys and mouse buttons are stored as GLFW codes (mouse:<button>).

# GAMEPLAY
infinite_ammo=true
show_fps=true

# VIDEO
max_fps=0
vsync=true
performance=2

# AUDIO
master_volume=100
music_volume=100
effects_volume=80

# MOVEMENT
bind_forward=87
bind_backward=83
bind_left=65
bind_right=68
bind_jump=32

# COMBAT
bind_shoot=mouse:0
bind_grenade=71

# INTERFACE
bind_menu=256
